name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Unit tests
        run: pio test -e native
      - name: Build ESP32 firmware
        # Same version plumbing as a release, so a broken flag fails here first.
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION_RAW=v0.0.0
        run: |
          pio run -e esp32dev
          grep -aq "kids-disc-player/v0.0.0" .pio/build/esp32dev/firmware.bin

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the freshness check diffs against the PR base
      - name: Previews updated with the CAD
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if grep -q '^cad/.*\.scad$' <<<"$changed" && ! grep -qE '^cad/(preview|stl)/' <<<"$changed"; then
            echo "::error::cad/*.scad changed but cad/preview and cad/stl did not. Run tools/render_previews.sh and commit the result."
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y openscad xvfb
      - name: Render previews and STLs
        run: tools/render_previews.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cad
          path: |
            cad/stl/
            cad/preview/

  # Pushing a tag like v1.2.0 publishes firmware.bin + version.txt as the latest
  # GitHub release. Devices in the field install it on their next boot.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, cad]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build release firmware
        working-directory: firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION_RAW=${{ github.ref_name }}
        run: |
          pio run -e esp32dev
          grep -aq "kids-disc-player/${GITHUB_REF_NAME}" .pio/build/esp32dev/firmware.bin
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp firmware/.pio/build/esp32dev/firmware.bin firmware.bin
          echo "$GITHUB_REF_NAME" > version.txt
          gh release create "$GITHUB_REF_NAME" firmware.bin version.txt --title "$GITHUB_REF_NAME" --generate-notes
