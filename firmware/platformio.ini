[platformio]
default_envs = esp32s3

; ESP32-S3 SuperMini: ESP32-S3 with 4 MB flash, its USB-C port wired to the
; chip's native USB (no USB-serial chip), so serial runs over USB CDC.
[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Two 1.9 MB app slots so the device can download an update next to the
; running firmware. Changing this later requires a USB flash.
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
; Release builds add -DFIRMWARE_VERSION_RAW=vX.Y.Z via PLATFORMIO_BUILD_FLAGS.
build_flags = -std=gnu++17 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.3
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit NeoPixel @ ^1.12.3

; Host-side unit tests for the pure logic in lib/discplayer: `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
